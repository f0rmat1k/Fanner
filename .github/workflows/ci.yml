name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # Windows-only: Fanner.App and Fanner.Hardware.Windows target net10.0-windows,
    # so a Linux runner cannot build them at all.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Fanner.slnx

      - name: Build
        run: dotnet build Fanner.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Fanner.slnx -c Release --no-build
